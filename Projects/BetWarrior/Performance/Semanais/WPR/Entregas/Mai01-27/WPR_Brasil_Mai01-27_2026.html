<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WPR BetWarrior Brasil — Mai 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0E0E0E; font-family: 'Archivo', sans-serif; }

/* ── CAPA ── */
.cover {
  width: 100%;
  aspect-ratio: 16/9;
  background: #111;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cv-hdr {
  background: #111; border-bottom: 2px solid #FF3900;
  display: flex; align-items: center; gap: 1.2vw;
  padding: 0 1.5vw; height: 7.4%; flex-shrink: 0;
}
.cv-logo-bar { width: 4px; height: 3.4vh; background: #FF3900; flex-shrink: 0; }
.cv-logo-brand { font-family: 'Archivo Black'; font-size: 1.1vw; letter-spacing: 1px; color: #FFF; }
.cv-logo-sub   { font-size: 0.6vw; color: #555; letter-spacing: 3px; text-transform: uppercase; }
.cv-hdr-sep    { width: 1px; height: 4vh; background: #2A2A2A; flex-shrink: 0; }
.cv-hdr-label  { font-family: 'Archivo Black'; font-size: 1.1vw; letter-spacing: 3px; text-transform: uppercase; color: #FFF; flex: 1; }
.cv-hdr-meta   { font-size: 0.7vw; color: #444; text-align: right; line-height: 1.8; letter-spacing: 0.5px; flex-shrink: 0; }

.cv-body {
  flex: 1; min-height: 0;
  display: flex;
}
.cv-left {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 4% 5% 4% 4%;
}
.cv-tag {
  font-size: 0.65vw; color: #FF3900;
  letter-spacing: 4px; text-transform: uppercase;
  margin-bottom: 2.5%;
}
.cv-title {
  font-family: 'Archivo Black';
  font-size: 5.8vw; color: #FFF;
  line-height: 1; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4%;
}
.cv-bar {
  width: 3vw; height: 3px; background: #FF3900;
  margin-bottom: 3.5%;
}
.cv-period {
  font-family: 'Archivo Black';
  font-size: 1.8vw; color: #FFF;
  letter-spacing: 2px; margin-bottom: 1.2%;
}
.cv-detail {
  font-size: 0.75vw; color: #555;
  letter-spacing: 2px; text-transform: uppercase;
  line-height: 1.9;
}
.cv-right {
  width: 36%; flex-shrink: 0;
  background: #FF3900;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.cv-right-bg {
  font-family: 'Archivo Black';
  font-size: 14vw; color: rgba(0,0,0,0.12);
  line-height: 1; letter-spacing: -4px;
  user-select: none; white-space: nowrap;
}
.cv-ftr {
  height: 2.8%; background: #111; border-top: 1px solid #1E1E1E;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5vw; font-size: 0.6vw; color: #3A3A3A;
  letter-spacing: 1px; flex-shrink: 0;
}

/* ── SEPARADOR ── */
.sep {
  width: 100%;
  height: 32px;
  background: #0E0E0E;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.sep-dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #2A2A2A;
}

/* ── SLIDE WRAPPER ── */
.slide-wrap {
  width: 100%;
  position: relative;
  overflow: hidden;
  line-height: 0;
}
.slide-wrap iframe {
  width: 1920px;
  height: 1080px;
  border: none;
  display: block;
  transform-origin: top left;
}
</style>
</head>
<body>

<!-- ── CAPA ── -->
<div class="cover">
  <div class="cv-hdr">
    <div class="cv-logo-bar"></div>
    <div>
      <div class="cv-logo-brand">BETWARRIOR</div>
      <div class="cv-logo-sub">BRASIL</div>
    </div>
    <div class="cv-hdr-sep"></div>
  </div>

  <div class="cv-body">
    <div class="cv-left">
      <div class="cv-tag">WPR · MAI 01–27 · 2026</div>
      <div class="cv-title">WEEKLY<br>PERFORMANCE<br>REPORT</div>
      <div class="cv-bar"></div>
      <div class="cv-period">01–27 / MAI · 2026</div>
      <div class="cv-detail">
        SB + Casino · BRL · Gerado 28/05<br>
        BetWarrior Brasil · Reunião WPR
      </div>
    </div>
    <div class="cv-right">
      <div class="cv-right-bg">WPR</div>
    </div>
  </div>

  <div class="cv-ftr">
    <span>BETWARRIOR BRASIL · CONFIDENTIAL</span>
    <span>WPR · CAPA · MAI 01–27/2026</span>
    <span>28/05/2026</span>
  </div>
</div>

<!-- ── SEPARADOR 0→1 ── -->
<div class="sep">
  <div class="sep-dot"></div><div class="sep-dot"></div><div class="sep-dot"></div>
</div>

<!-- ── PÁG. 1 — Visão Geral ── -->
<div class="slide-wrap" id="s1">
  <iframe src="wpr-mai-01-27-slide.html?v=2" scrolling="no" title="Pág. 1"></iframe>
</div>

<!-- ── SEPARADOR 1→2 ── -->
<div class="sep">
  <div class="sep-dot"></div><div class="sep-dot"></div><div class="sep-dot"></div>
</div>

<!-- ── PÁG. 2 — Aquisição por Canal ── -->
<div class="slide-wrap" id="s2">
  <iframe src="wpr-mai-01-27-slide-p2.html?v=2" scrolling="no" title="Pág. 2"></iframe>
</div>

<!-- ── SEPARADOR 2→3 ── -->
<div class="sep">
  <div class="sep-dot"></div><div class="sep-dot"></div><div class="sep-dot"></div>
</div>

<!-- ── PÁG. 3 — Performance de Mídia ── -->
<div class="slide-wrap" id="s3">
  <iframe src="wpr-mai-01-27-slide-p3.html?v=2" scrolling="no" title="Pág. 3"></iframe>
</div>

<!-- ── SEPARADOR 3→4 ── -->
<div class="sep">
  <div class="sep-dot"></div><div class="sep-dot"></div><div class="sep-dot"></div>
</div>

<!-- ── PÁG. 4 — Próximos Passos ── -->
<div class="slide-wrap" id="s4">
  <iframe src="wpr-mai-01-27-slide-p4.html?v=2" scrolling="no" title="Pág. 4"></iframe>
</div>

<!-- padding final -->
<div style="height: 40px; background: #0E0E0E;"></div>

<script>
function scaleSlides() {
  document.querySelectorAll('.slide-wrap').forEach(wrap => {
    const scale = wrap.clientWidth / 1920;
    wrap.style.height = Math.round(1080 * scale) + 'px';
    const iframe = wrap.querySelector('iframe');
    if (iframe) iframe.style.transform = 'scale(' + scale + ')';
  });
}
scaleSlides();
window.addEventListener('resize', scaleSlides);
</script>

</body>
</html>
